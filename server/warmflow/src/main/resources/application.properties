server.address=127.0.0.1
server.port=${WARMFLOW_PORT:4319}
spring.datasource.url=${WARMFLOW_DATABASE_URL:jdbc:h2:file:./.workflow-data/warmflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${WARMFLOW_DATABASE_USER:sa}
spring.datasource.password=${WARMFLOW_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.shutdown=graceful
spring.jackson.serialization.write-dates-as-timestamps=false

warmflow.bridge-token=${WARMFLOW_BRIDGE_TOKEN}
